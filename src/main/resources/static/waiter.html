<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garson Paneli | Lezzet Durağı</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FFF8F3;
            --text-main: #2D3436;
            --card-bg: #FFFFFF;
            --primary-gradient: linear-gradient(135deg, #FF6B6B, #FF8E53);
            --empty-color: #55E6C1; /* Yeşil - Boş */
            --full-color: #FF7675;  /* Kırmızı - Dolu */
            --reserved-color: #FDCB6E; /* Sarı - Rezerve */
            --checkout-color: #00B894;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        /* Üst Menü (Navbar) */
        .navbar {
            background: var(--primary-gradient);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.2);
        }

        .navbar h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 600;
        }

        .logout-btn {
            background-color: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background-color: rgba(255, 255, 255, 0.4);
        }

        /* Ana İçerik ve Masa Grid'i */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 800;
            color: #FF6B6B;
            margin-bottom: 25px;
            text-align: center;
        }

        .table-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
        }

        /* Masa Kartları */
        .table-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-bottom: 5px solid transparent;
        }

        .table-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 25px rgba(0,0,0,0.1);
        }

        .table-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .table-name {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .table-capacity {
            font-size: 14px;
            color: #B2BEC3;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .table-status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: 800;
            color: white;
        }

        /* Durumlara Göre Dinamik Renkler */
        .status-bos { border-bottom-color: var(--empty-color); }
        .status-bos .table-icon { color: var(--empty-color); }
        .status-bos .table-status { background-color: var(--empty-color); }

        .status-dolu { border-bottom-color: var(--full-color); }
        .status-dolu .table-icon { color: var(--full-color); }
        .status-dolu .table-status { background-color: var(--full-color); }

        .status-rezerve { border-bottom-color: var(--reserved-color); }
        .status-rezerve .table-icon { color: var(--reserved-color); }
        .status-rezerve .table-status { background-color: var(--reserved-color); }

        .error-message {
            text-align: center;
            color: #D63031;
            font-weight: 600;
            margin-top: 50px;
        }

        /* PROFESYONEL ÖZEL MODAL (AÇILIR PENCERE) TASARIMI */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.6);
            display: none; /* Başlangıçta gizli */
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.show {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 25px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            transform: translateY(-20px);
            transition: transform 0.3s ease;
            text-align: center;
        }

        .modal-overlay.show .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            margin-bottom: 20px;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
        }
        
        .modal-header p {
            color: #B2BEC3;
            margin: 5px 0 0 0;
            font-weight: 600;
        }

        .modal-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }

        .modal-btn {
            padding: 16px;
            border-radius: 15px;
            border: none;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: white;
            transition: all 0.2s;
        }

        .btn-add-order {
            background: var(--primary-gradient);
            box-shadow: 0 8px 15px rgba(255, 107, 107, 0.3);
        }

        .btn-checkout {
            background: var(--checkout-color);
            box-shadow: 0 8px 15px rgba(0, 184, 148, 0.3);
        }

        .btn-cancel {
            background: transparent;
            color: #636E72;
            border: 2px solid #DFE6E9;
        }

        .modal-btn:hover:not(.btn-cancel) {
            transform: translateY(-2px);
        }
        
        .btn-cancel:hover {
            background: #F1F2F6;
        }
    </style>
</head>
<body>

    <!-- PROFESYONEL MODAL HTML YAPISI -->
    <div id="actionModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTableTitle">Masa Seçimi</h3>
                <p>Lütfen yapmak istediğiniz işlemi seçin</p>
            </div>
            
            <div class="modal-buttons">
                <button class="modal-btn btn-add-order" onclick="navigateToAddOrder()">
                    <i class="fa-solid fa-plus"></i> Yeni Ürün Ekle
                </button>
                <button class="modal-btn btn-checkout" onclick="navigateToCheckout()">
                    <i class="fa-solid fa-receipt"></i> Hesabı Kapat
                </button>
                <button class="modal-btn btn-cancel" onclick="closeModal()">
                    İptal Et
                </button>
            </div>
        </div>
    </div>

    <nav class="navbar">
        <h1>🍽️ Lezzet Durağı</h1>
        <div class="user-info">
            <span><i class="fa-solid fa-user-circle"></i> <span id="userNameDisplay">Personel</span></span>
            <button class="logout-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Çıkış</button>
        </div>
    </nav>

    <div class="container">
        <div class="section-title">Masa Durumları</div>
        
        <div id="table-container" class="table-grid">
            <div style="text-align:center; grid-column: 1 / -1; color: #B2BEC3;">
                <i class="fa-solid fa-spinner fa-spin" style="font-size: 30px;"></i><br><br>Masalar Yükleniyor...
            </div>
        </div>
    </div>

    <script>
        // 1. GÜVENLİK KONTROLÜ: Token var mı?
        const token = localStorage.getItem('jwtToken');
        const username = localStorage.getItem('username');

        if (!token) {
            alert("Lütfen önce giriş yapın!");
            window.location.href = '/login.html';
        } else {
            if (username) {
                document.getElementById('userNameDisplay').innerText = username;
            }
            document.addEventListener('DOMContentLoaded', loadTables);
        }

        // Modal için geçici değişkenler
        let selectedTableId = null;
        let selectedTableName = "";

        // 2. MASALARI BACKEND'DEN ÇEK
        function loadTables() {
            fetch('/api/tables', {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (response.status === 401 || response.status === 403) {
                    throw new Error("Yetkisiz erişim. Oturumunuz süresi dolmuş olabilir.");
                }
                if (!response.ok) throw new Error("Masalar yüklenemedi!");
                return response.json();
            })
            .then(tables => {
                const container = document.getElementById('table-container');
                container.innerHTML = ''; 

                if (tables.length === 0) {
                    container.innerHTML = '<div class="error-message">Henüz hiç masa eklenmemiş.</div>';
                    return;
                }

                tables.forEach(table => {
                    let statusClass = '';
                    let statusText = table.status;
                    let iconClass = 'fa-solid fa-utensils';

                    if (table.status === 'BOŞ') {
                        statusClass = 'status-bos';
                    } else if (table.status === 'DOLU') {
                        statusClass = 'status-dolu';
                    } else if (table.status === 'REZERVE') {
                        statusClass = 'status-rezerve';
                        iconClass = 'fa-solid fa-calendar-check';
                    }

                    const card = document.createElement('div');
                    card.className = `table-card ${statusClass}`;
                    card.innerHTML = `
                        <div class="table-icon"><i class="${iconClass}"></i></div>
                        <div class="table-name">${table.tableName}</div>
                        <div class="table-capacity"><i class="fa-solid fa-users"></i> Kapasite: ${table.capacity}</div>
                        <div class="table-status">${statusText}</div>
                    `;

                    // Masaya Tıklanma Olayı
                    card.onclick = () => {
                        const encodedTableName = encodeURIComponent(table.tableName);
                        
                        if (table.status === 'DOLU') {
                            // AMATÖR ALERTLER YERİNE PROFESYONEL MODALI AÇIYORUZ
                            openModal(table.id, table.tableName);
                        } else {
                            // Boş veya rezerve masaya tıklanırsa direkt sipariş al
                            window.location.href = `/order.html?tableId=${table.id}&tableName=${encodedTableName}`;
                        }
                    };

                    container.appendChild(card);
                });
            })
            .catch(error => {
                console.error('Hata:', error);
                document.getElementById('table-container').innerHTML = `
                    <div class="error-message">
                        <i class="fa-solid fa-triangle-exclamation" style="font-size: 40px; margin-bottom: 15px;"></i><br>
                        ${error.message}<br>Lütfen tekrar giriş yapmayı deneyin.
                    </div>
                `;
            });
        }

        // --- PROFESYONEL MODAL FONKSİYONLARI ---
        function openModal(id, name) {
            selectedTableId = id;
            selectedTableName = name;
            
            document.getElementById('modalTableTitle').innerText = name + " Menüsü";
            const modal = document.getElementById('actionModal');
            
            modal.style.display = 'flex';
            // CSS Animasyonu için ufak bir gecikme
            setTimeout(() => {
                modal.classList.add('show');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('actionModal');
            modal.classList.remove('show');
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300); // Animasyon süresi kadar bekle
        }

        function navigateToAddOrder() {
            const encoded = encodeURIComponent(selectedTableName);
            window.location.href = `/order.html?tableId=${selectedTableId}&tableName=${encoded}`;
        }

        function navigateToCheckout() {
            const encoded = encodeURIComponent(selectedTableName);
            window.location.href = `/bill.html?tableId=${selectedTableId}&tableName=${encoded}`;
        }
        // ---------------------------------------

        // 3. ÇIKIŞ YAPMA İŞLEMİ
        function logout() {
            localStorage.clear();
            window.location.href = '/login.html';
        }
    </script>
</body>
</html>
