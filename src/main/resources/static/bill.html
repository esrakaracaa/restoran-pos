<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Hesap Ödeme | Lezzet Durağı</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #FFF8F3; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .bill-card { background: white; padding: 40px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        .total-amount { font-size: 40px; font-weight: 800; color: #FF6B6B; margin: 20px 0; }
        .pay-btn { background: #00B894; color: white; border: none; padding: 15px 30px; border-radius: 15px; font-size: 18px; font-weight: 800; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <div class="bill-card">
        <h2 id="tableTitle">Masa Hesabı</h2>
        <div class="total-amount" id="totalAmount">0.00 ₺</div>
        <button class="pay-btn" onclick="markAsPaid()">Ödemeyi Al ve Masayı Boşalt</button>
        <p style="margin-top: 20px; color: #636E72; cursor: pointer;" onclick="window.history.back()">Geri Dön</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const tableId = urlParams.get('tableId');
        const billId = urlParams.get('billId'); // Hesap ID'si
        const total = urlParams.get('total');
        
        document.getElementById('totalAmount').innerText = total + " ₺";

        async function markAsPaid() {
            const token = localStorage.getItem('jwtToken');
            
            // 1. Faturayı "Ödendi" olarak işaretle
            await fetch(`http://localhost:8080/api/bills/${billId}/pay`, {
                method: 'PATCH',
                headers: { 'Authorization': 'Bearer ' + token }
            });

            // 2. Masayı "BOŞ" yap
            await fetch(`http://localhost:8080/api/tables/${tableId}/status?status=BOŞ`, {
                method: 'PATCH',
                headers: { 'Authorization': 'Bearer ' + token }
            });

            alert("Ödeme alındı, masa boşaltıldı!");
            window.location.href = '/waiter.html';
        }
    </script>
</body>
</html>
