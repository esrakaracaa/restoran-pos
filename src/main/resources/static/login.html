<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personel Girişi | Lezzet Durağı</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FFF8F3; 
            --text-main: #2D3436;
            --card-bg: #FFFFFF;
            --primary-color: #FF6B6B;
            --primary-gradient: linear-gradient(135deg, #FF6B6B, #FF8E53);
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            background-color: var(--card-bg);
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 107, 107, 0.15);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo-area {
            margin-bottom: 30px;
        }

        .logo-area h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-area p {
            color: #B2BEC3;
            font-weight: 600;
            margin-top: 5px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
            position: relative;
        }

        .input-group i {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            color: #B2BEC3;
        }

        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 2px solid #F1F2F6;
            border-radius: 15px;
            font-family: 'Nunito', sans-serif;
            font-size: 15px;
            font-weight: 600;
            box-sizing: border-box;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(255, 107, 107, 0.1);
        }

        .login-btn {
            width: 100%;
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(255, 107, 107, 0.2);
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px rgba(255, 107, 107, 0.3);
        }

        .login-btn:disabled {
            background: #b2bec3;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .error-message {
            color: #D63031;
            background-color: #FF767533;
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            display: none;
        }

        /* --- YENİ: Müşteri Menüsü Yönlendirme Tasarımı --- */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0 20px 0;
            color: #B2BEC3;
            font-weight: 800;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 2px dashed #DFE6E9;
        }

        .divider:not(:empty)::before { margin-right: 15px; }
        .divider:not(:empty)::after { margin-left: 15px; }

        .menu-link-btn {
            display: block;
            background: transparent;
            color: #00B894;
            border: 2px solid #00B894;
            padding: 14px;
            width: 100%;
            border-radius: 12px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            transition: all 0.3s;
            text-align: center;
        }

        .menu-link-btn:hover {
            background: #00B894;
            color: white;
            box-shadow: 0 8px 15px rgba(0, 184, 148, 0.3);
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-area">
            <h1>🍽️ Lezzet Durağı</h1>
            <p>Personel Giriş Sistemi</p>
        </div>

        <div id="errorMessage" class="error-message">
            <i class="fa-solid fa-circle-exclamation"></i> <span id="errorText">Kullanıcı adı veya şifre hatalı!</span>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="username" placeholder="Kullanıcı Adı" required autocomplete="off">
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="Şifre" required>
            </div>

            <button type="submit" class="login-btn" id="submitBtn">
                <i class="fa-solid fa-right-to-bracket"></i> Giriş Yap
            </button>
            
            <!-- YENİ EKLENEN MÜŞTERİ YÖNLENDİRME KISMI -->
            <div class="divider">Müşteri misiniz?</div>
            <a href="/menu.html" class="menu-link-btn">
                <i class="fa-solid fa-utensils"></i> Dijital Menüyü İncele
            </a>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const usernameVal = document.getElementById('username').value;
            const passwordVal = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const submitBtn = document.getElementById('submitBtn');

            localStorage.clear();

            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Kontrol Ediliyor...';
            submitBtn.disabled = true;
            errorDiv.style.display = 'none';

            fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    username: usernameVal,
                    password: passwordVal
                })
            })
            .then(async response => {
                if (!response.ok) {
                    const errorMsg = await response.text();
                    throw new Error(errorMsg || "Giriş başarısız oldu. Bilgilerinizi kontrol edin.");
                }
                return response.json();
            })
            .then(data => {
                localStorage.setItem('jwtToken', data.token);
                localStorage.setItem('userRole', data.role);
                localStorage.setItem('username', data.username);

                if (data.role === 'ADMIN' || data.role === 'ROLE_ADMIN') {
                    window.location.href = '/admin.html';
                } else {
                    window.location.href = '/waiter.html';
                }
            })
            .catch(error => {
                errorText.innerText = error.message;
                errorDiv.style.display = 'block';
                
                submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Giriş Yap';
                submitBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
